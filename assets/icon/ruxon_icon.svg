<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#22262B"/>
      <stop offset="1" stop-color="#121417"/>
    </linearGradient>
    <!-- userSpaceOnUse: one continuous gradient across the whole glyph, no seams -->
    <linearGradient id="accent" gradientUnits="userSpaceOnUse" x1="0" y1="267" x2="0" y2="757">
      <stop offset="0" stop-color="#FFB44D"/>
      <stop offset="1" stop-color="#E8941F"/>
    </linearGradient>
  </defs>

  <!-- macOS squircle: 824x824 at (100,100), corner radius 185 -->
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#bg)"/>
  <rect x="101" y="101" width="822" height="822" rx="184" fill="none" stroke="#FFFFFF" stroke-opacity="0.07" stroke-width="2"/>

  <!-- R monogram, leg replaced by play triangle (tightened gaps: 48 below bowl, 22 from stem) -->
  <g fill="url(#accent)">
    <!-- stem -->
    <rect x="347" y="267" width="76" height="490" rx="14"/>
    <!-- bowl (evenodd for counter hole) -->
    <path fill-rule="evenodd" d="M400,267 H550 A105,105 0 0 1 550,477 H400 V402 H540 A30,30 0 0 0 540,342 H400 Z"/>
    <!-- play-triangle leg -->
    <path d="M445,525 L445,755 L658,640 Z"/>
  </g>
</svg>
