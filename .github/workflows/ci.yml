name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    runs-on: ${{ matrix.os }}

    steps:
    - uses: actions/checkout@v4

    - name: Install dependencies (Ubuntu)
      if: matrix.os == 'ubuntu-latest'
      run: sudo apt-get update && sudo apt-get install -y ninja-build libsdl3-dev libgl1-mesa-dev

    - name: Install dependencies (macOS)
      if: matrix.os == 'macos-latest'
      run: brew install sdl3

    - name: Install dependencies (Windows)
      if: matrix.os == 'windows-latest'
      run: vcpkg install sdl3:x64-windows

    - name: Configure CMake
      shell: bash
      env:
        VCPKG_ROOT: ${{ env.VCPKG_INSTALLATION_ROOT }}
      run: |
        if [ "$RUNNER_OS" = "Windows" ]; then
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_TOOLCHAIN_FILE="$VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake"
        else
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
        fi

    - name: Build
      run: cmake --build build --config Release

    - name: Test
      run: cd build && ctest --output-on-failure || true
